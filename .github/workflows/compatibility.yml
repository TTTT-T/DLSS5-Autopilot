# Adds up every shared result into docs/compatibility.json, which the tool
# downloads before an install to say what other people found in this game.
#
# Manual-only in this fork: results are rebuilt only when explicitly run.
name: compatibility

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: compatibility
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Read every result issue and add them up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/compatibility.py

      - name: Commit the file if it changed
        run: |
          if git diff --quiet -- docs/compatibility.json; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/compatibility.json
          git commit -m "compatibility: rebuild from the shared results"
          git push
