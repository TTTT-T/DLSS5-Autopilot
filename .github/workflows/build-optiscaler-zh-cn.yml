name: Build localized OptiScaler zh-CN

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-optiscaler-zh-cn.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout localized OptiScaler source
        uses: actions/checkout@v4
        with:
          repository: Moeblack/OptiScaler_DLSSNR
          ref: 4417c0ee59c880ae7f9d8f77da43d411dfbaba59
          submodules: recursive
          path: optiscaler-src

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build localized DLL
        shell: pwsh
        working-directory: optiscaler-src
        run: msbuild /m /p:Configuration=Release . /verbosity:minimal

      - name: Verify localization payload
        shell: pwsh
        run: |
          if (!(Test-Path 'optiscaler-src/OptiScaler_zh.ini')) { throw 'OptiScaler_zh.ini missing' }
          if (!(Test-Path 'optiscaler-src/x64/Release/a/OptiScaler.dll')) { throw 'localized OptiScaler.dll missing' }
          $text = Get-Content 'optiscaler-src/OptiScaler_zh.ini' -Raw -Encoding UTF8
          foreach ($needle in @('Enable Neural Rendering','Frame Generation','Advanced Settings','Logging')) {
            if ($text -notmatch [regex]::Escape($needle)) { throw "translation dictionary missing: $needle" }
          }

      - name: Build clean runtime package from official v0.2.0
        shell: pwsh
        run: |
          $official = 'https://github.com/Dagherbou/OptiScaler_DLSSNR/releases/download/v0.2.0-dlssnr/OptiScaler-DLSSNR-v0.2.0.zip'
          Invoke-WebRequest -Uri $official -OutFile official.zip
          Expand-Archive -Path official.zip -DestinationPath runtime -Force

          $main = Get-ChildItem runtime -Recurse -File -Filter OptiScaler.dll | Select-Object -First 1
          if (!$main) { throw 'official package has no OptiScaler.dll' }
          $root = $main.Directory.FullName

          Copy-Item 'optiscaler-src/x64/Release/a/OptiScaler.dll' (Join-Path $root 'OptiScaler.dll') -Force
          Copy-Item 'optiscaler-src/OptiScaler_zh.ini' (Join-Path $root 'OptiScaler_zh.ini') -Force

          if (!(Test-Path (Join-Path $root 'nvngx.dll_dlssnr.dll'))) { throw 'official runtime forwarder missing' }
          if (!(Test-Path (Join-Path $root 'OptiScaler_zh.ini'))) { throw 'localized dictionary missing from runtime root' }
          if ((Get-Item (Join-Path $root 'OptiScaler.dll')).Length -lt 1MB) { throw 'localized OptiScaler.dll is unexpectedly small' }

          $count = (Get-ChildItem $root -Recurse -File).Count
          Write-Host "runtime file count: $count"
          if ($count -lt 5 -or $count -gt 500) { throw "unexpected runtime file count: $count" }

          Compress-Archive -Path (Join-Path $root '*') -DestinationPath 'OptiScaler-DLSSNR-zh-CN.zip' -CompressionLevel Optimal -Force

      - name: Package corresponding source
        shell: pwsh
        run: |
          Push-Location optiscaler-src
          Get-ChildItem -Force -Directory -Filter .git -Recurse | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          tar -czf ../OptiScaler-DLSSNR-zh-CN-source.tar.gz .
          Pop-Location

      - name: Verify distributable archive
        shell: pwsh
        run: |
          Expand-Archive -Path 'OptiScaler-DLSSNR-zh-CN.zip' -DestinationPath verify-runtime -Force
          if (!(Test-Path 'verify-runtime/OptiScaler.dll')) { throw 'archive missing OptiScaler.dll at root' }
          if (!(Test-Path 'verify-runtime/nvngx.dll_dlssnr.dll')) { throw 'archive missing nvngx.dll_dlssnr.dll at root' }
          if (!(Test-Path 'verify-runtime/OptiScaler_zh.ini')) { throw 'archive missing OptiScaler_zh.ini at root' }
          $count = (Get-ChildItem verify-runtime -Recurse -File).Count
          if ($count -lt 5 -or $count -gt 500) { throw "bad packaged runtime file count: $count" }

      - name: Publish rolling localized OptiScaler release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          OptiScaler 简体中文滚动构建。

          - 运行时文件结构基于 Dagherbou 官方 v0.2.0 发布包
          - 仅替换为带中文本地化实现的 OptiScaler.dll，并加入 OptiScaler_zh.ini
          - 不再发布 Visual Studio 编译目录，避免把源码/中间产物装进游戏
          - 对应源码来自 Moeblack/OptiScaler_DLSSNR 提交 4417c0ee59c880ae7f9d8f77da43d411dfbaba59
          "@

          if (gh release view optiscaler-zh-CN-latest --repo $env:GITHUB_REPOSITORY *> $null) {
            gh release edit optiscaler-zh-CN-latest --repo $env:GITHUB_REPOSITORY --title 'OptiScaler 简体中文版（最新版）' --notes $notes
            gh release delete-asset optiscaler-zh-CN-latest 'OptiScaler-DLSSNR-zh-CN.7z' --repo $env:GITHUB_REPOSITORY --yes 2>$null; $global:LASTEXITCODE = 0
            gh release delete-asset optiscaler-zh-CN-latest 'OptiScaler-DLSSNR-zh-CN-source.zip' --repo $env:GITHUB_REPOSITORY --yes 2>$null; $global:LASTEXITCODE = 0
            gh release delete-asset optiscaler-zh-CN-latest 'OptiScaler-DLSSNR-zh-CN.zip' --repo $env:GITHUB_REPOSITORY --yes 2>$null; $global:LASTEXITCODE = 0
            gh release delete-asset optiscaler-zh-CN-latest 'OptiScaler-DLSSNR-zh-CN-source.tar.gz' --repo $env:GITHUB_REPOSITORY --yes 2>$null; $global:LASTEXITCODE = 0
          } else {
            gh release create optiscaler-zh-CN-latest --repo $env:GITHUB_REPOSITORY --title 'OptiScaler 简体中文版（最新版）' --notes $notes
          }

          gh release upload optiscaler-zh-CN-latest `
            'OptiScaler-DLSSNR-zh-CN.zip' `
            'OptiScaler-DLSSNR-zh-CN-source.tar.gz' `
            --repo $env:GITHUB_REPOSITORY
