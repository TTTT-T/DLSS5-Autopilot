name: Sync upstream and reapply zh-CN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout localized main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: work

      - name: Checkout localization source
        uses: actions/checkout@v4
        with:
          ref: localization
          path: l10n

      - name: Fetch and merge upstream
        working-directory: work
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/Kizzuwatnaa/DLSS5-Autopilot.git || true
          git fetch upstream main
          git merge --no-edit -X theirs upstream/main

      - name: Refresh upstream mirror branch
        working-directory: work
        run: git push origin upstream/main:refs/heads/upstream --force

      - name: Reapply Chinese localization
        run: |
          python l10n/tools/apply_localization.py work
          cd work
          git checkout HEAD -- .github/workflows

      - name: Commit localized changes
        working-directory: work
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Already current"
          else
            git commit -m "zh-CN: refresh localization [skip ci]"
          fi
          git push origin main
