name: Build and publish zh-CN EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller certifi

      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --noupx `
            --name dlss5-autopilot-zh-CN `
            --version-file version_info.txt `
            --icon dlss5-autopilot.ico `
            --distpath dist `
            --noconfirm `
            dlss5_autopilot.py

      - name: Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/dlss5-autopilot-zh-CN.exe -Algorithm SHA256).Hash.ToLower()
          "SHA256  dlss5-autopilot-zh-CN.exe  $hash" | Out-File -Encoding ascii dist/SHA256.txt
          Get-Content dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dlss5-autopilot-zh-CN
          path: |
            dist/dlss5-autopilot-zh-CN.exe
            dist/SHA256.txt
          if-no-files-found: error

      - name: Publish rolling latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f zh-CN-latest $env:GITHUB_SHA
          git push origin refs/tags/zh-CN-latest --force

          $notes = @"
          DLSS5-Autopilot 简体中文版自动构建。

          - 基于当前 main 分支自动编译
          - main 会定期同步上游并重新应用汉化
          - 下载 `dlss5-autopilot-zh-CN.exe` 即可
          - `SHA256.txt` 用于校验文件完整性

          Commit: $env:GITHUB_SHA
          "@

          if (gh release view zh-CN-latest --repo $env:GITHUB_REPOSITORY *> $null) {
            gh release edit zh-CN-latest `
              --repo $env:GITHUB_REPOSITORY `
              --title "DLSS5-Autopilot 简体中文版（最新版）" `
              --notes $notes `
              --latest
          } else {
            gh release create zh-CN-latest `
              --repo $env:GITHUB_REPOSITORY `
              --title "DLSS5-Autopilot 简体中文版（最新版）" `
              --notes $notes `
              --latest
          }

          gh release upload zh-CN-latest `
            dist/dlss5-autopilot-zh-CN.exe `
            dist/SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
