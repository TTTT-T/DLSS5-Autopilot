name: Build and publish zh-CN EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller certifi

      - name: Syntax and import smoke tests
        shell: pwsh
        run: |
          python -m compileall -q dlss5_autopilot.py core
          python -c "import dlss5_autopilot; import core.gui; import core.i18n_zh_cn"

      - name: zh-CN Tkinter wrapper regression test
        shell: pwsh
        run: |
          @'
          from core.i18n_zh_cn import _wrap_init

          calls = []
          def original(self, *args, **kwargs):
              calls.append((args, kwargs))
              return "ok"

          wrapped = _wrap_init(original)
          result = wrapped(object(), "master", "ttk::separator", {"text": "Start"})
          assert result == "ok"
          args, kwargs = calls[-1]
          assert len(args) == 3, args
          assert args[0] == "master"
          assert args[1] == "ttk::separator"
          assert args[2]["text"] == "开始", args[2]

          calls.clear()
          result = wrapped(object(), "master", {"text": "Install"}, text="Cancel")
          assert result == "ok"
          args, kwargs = calls[-1]
          assert args[1]["text"] == "安装", args
          assert kwargs["text"] == "取消", kwargs
          print("zh-CN Tkinter wrapper regression test passed")
          '@ | python -

      - name: Visible zh-CN coverage regression test
        shell: pwsh
        run: |
          @'
          from core.i18n_zh_cn import tr

          cases = {
              "dlss5 for the games you have": "让你已有的游戏用上 DLSS 5",
              "your library": "游戏库",
              "settings and go": "设置并安装",
              "[ scan games ]": "[ 扫描游戏 ]",
              "[ open log file ]": "[ 打开日志文件 ]",
              "[ report a bug ]": "[ 报告问题 ]",
              "[ suggest a feature ]": "[ 建议新功能 ]",
              "[ how it works ]": "[ 工作原理 ]",
              "[ update now ]": "[ 立即更新 ]",
              "!! before you get your hopes up": "!! 使用前先说明",
          }
          for src, expected in cases.items():
              got = tr(src)
              assert got == expected, (src, got, expected)

          dynamic = tr("New DLSS5 driver detected - 591.86 available for download")
          assert "检测到新的 DLSS5 驱动" in dynamic, dynamic
          assert "可下载" in dynamic, dynamic
          print("visible zh-CN coverage regression test passed")
          '@ | python -

      - name: Localized OptiScaler source regression test
        shell: pwsh
        run: |
          @'
          from core import optiscaler
          expected = "https://api.github.com/repos/TTTT-T/DLSS5-Autopilot/releases/tags/optiscaler-zh-CN-latest"
          assert optiscaler.API == expected, optiscaler.API
          print("localized OptiScaler release source test passed")
          '@ | python -

      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --noupx `
            --name dlss5-autopilot-zh-CN `
            --version-file version_info.txt `
            --icon dlss5-autopilot.ico `
            --distpath dist `
            --noconfirm `
            dlss5_autopilot.py

      - name: Hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/dlss5-autopilot-zh-CN.exe -Algorithm SHA256).Hash.ToLower()
          "SHA256  dlss5-autopilot-zh-CN.exe  $hash" | Out-File -Encoding ascii dist/SHA256.txt
          Get-Content dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dlss5-autopilot-zh-CN
          path: |
            dist/dlss5-autopilot-zh-CN.exe
            dist/SHA256.txt
          if-no-files-found: error

      - name: Publish rolling latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $notes = @"
          DLSS5-Autopilot 简体中文版自动构建。

          - 基于当前 main 分支自动编译
          - 发布前必须通过语法、导入、Tkinter 兼容、可见中文覆盖和中文 OptiScaler 源检查
          - main 会定期同步上游并重新应用汉化
          - 下载 `dlss5-autopilot-zh-CN.exe` 即可
          - `SHA256.txt` 用于校验文件完整性

          Commit: $env:GITHUB_SHA
          "@

          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/zh-CN-latest" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $releaseId = ($releaseJson | ConvertFrom-Json).id
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" `
              -f "name=DLSS5-Autopilot 简体中文版（最新版）" `
              -f "body=$notes" `
              -f "target_commitish=$env:GITHUB_SHA" `
              -f "make_latest=true" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "failed to update rolling release metadata" }
          } else {
            gh release create zh-CN-latest `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "DLSS5-Autopilot 简体中文版（最新版）" `
              --notes $notes `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "failed to create rolling release" }
          }

          gh release upload zh-CN-latest `
            dist/dlss5-autopilot-zh-CN.exe `
            dist/SHA256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "failed to upload rolling release assets" }

          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/zh-CN-latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "failed to verify rolling release" }
          $exe = $published.assets | Where-Object { $_.name -eq 'dlss5-autopilot-zh-CN.exe' }
          if (-not $exe) { throw "release verification failed: EXE asset missing" }
          Write-Host "Published EXE asset id=$($exe.id), digest=$($exe.digest)"
